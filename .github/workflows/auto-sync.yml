name: Auto Sync Upstream & Trigger Build

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PAT_TOKEN is set
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "❌ ERROR: PAT_TOKEN is empty or not set in secrets."
            exit 1
          else
            echo "✅ PAT_TOKEN is set with length ${#PAT_TOKEN}"
          fi

      - name: Test PAT_TOKEN with git ls-remote
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "Testing token against repository..."
          if git ls-remote https://oauth2:${PAT_TOKEN}@github.com/${{ github.repository }}.git HEAD; then
            echo "✅ Token is valid and has read access."
          else
            echo "❌ ERROR: Token failed to access repository. Please check token permissions or regenerate it."
            exit 1
          fi

      - name: Checkout repository using git clone with PAT
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git clone https://oauth2:${PAT_TOKEN}@github.com/${{ github.repository }}.git .
          git checkout main

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/cctv18/oppo_oplus_realme_sm8750.git
          git fetch upstream

      - name: Configure git user
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Merge upstream changes while preserving auto-sync.yml
        id: merge
        run: |
          set +e
          git merge --no-commit --no-ff upstream/main
          MERGE_EXIT_CODE=$?
          set -e

          if [ $MERGE_EXIT_CODE -eq 0 ]; then
            if git diff --cached --quiet; then
              echo "No changes from upstream, skipping commit."
              git merge --abort 2>/dev/null || true
              echo "has_new_commits=false" >> $GITHUB_OUTPUT
            else
              echo "New commits from upstream, preserving auto-sync.yml..."
              git checkout HEAD -- .github/workflows/auto-sync.yml
              git commit -m "Auto-merge upstream changes (preserve auto-sync.yml)"
              echo "has_new_commits=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "Merge failed with exit code $MERGE_EXIT_CODE"
            git merge --abort 2>/dev/null || true
            exit 1
          fi

      # ========== 推送使用 GITHUB_TOKEN + oauth2 格式 ==========
      - name: Push changes to your fork using GITHUB_TOKEN (oauth2)
        if: steps.merge.outputs.has_new_commits == 'true'
        run: |
          git push https://oauth2:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git main

      - name: Trigger kernel build using PAT
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh workflow run fastbuild_6.6.89.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f ksu_type="resukisu" \
            -f susfs_enable="false" \
            -f kpm_enable="false" \
            -f lz4_enable="true" \
            -f lz4kd_enable="false" \
            -f bbr_enable="false" \
            -f better_net="false" \
            -f adios_enable="true" \
            -f rekernel_enable="true" \
            -f baseband_guard="true" \
            -f ccache_update="false" \
            -f ccache_debug="false" \
            -f kernel_suffix=""
