name: Auto Sync Upstream & Trigger Build

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/cctv18/oppo_oplus_realme_sm8750.git
          git fetch upstream

      - name: Merge upstream changes while preserving auto-sync.yml
        run: |
          set +e
          git merge --no-commit --no-ff upstream/main
          MERGE_EXIT_CODE=$?
          set -e

          if [ $MERGE_EXIT_CODE -eq 0 ]; then
            if git diff --cached --quiet; then
              echo "No changes from upstream."
              echo "has_new_commits=false" >> $GITHUB_ENV
              git merge --abort 2>/dev/null || true
            else
              echo "Upstream has new commits. Preserving auto-sync.yml..."
              SELF_FILE=".github/workflows/auto-sync.yml"
              [ -f "$SELF_FILE" ] && git checkout HEAD -- "$SELF_FILE"
              # 注意：此时还未提交，我们稍后会修改 fastbuild_6.6.89.yml
              echo "has_new_commits=true" >> $GITHUB_ENV
            fi
          else
            echo "Merge conflict, aborting."
            git merge --abort
            exit 1
          fi

      - name: Set your preferred defaults in fastbuild_6.6.89.yml
        if: env.has_new_commits == 'true'
        run: |
          FILE=".github/workflows/fastbuild_6.6.89.yml"
          if [ -f "$FILE" ]; then
            echo "Modifying default values in $FILE according to your preferences..."

            # ksu_type: default resukisu
            sed -i 's/^\(\s*\)default: '"'"'.*'"'"'\(\s*#.*ksu_type\)/\1default: '"'resukisu'"'\2/' "$FILE"
            # susfs_enable: default false
            sed -i 's/^\(\s*\)default: true\(\s*#.*susfs_enable\)/\1default: false\2/' "$FILE"
            # kpm_enable: default false (已经是false，但确保)
            sed -i 's/^\(\s*\)default: '"'"'.*'"'"'\(\s*#.*kpm_enable\)/\1default: '"'false'"'\2/' "$FILE"
            # lz4_enable: default true
            sed -i 's/^\(\s*\)default: false\(\s*#.*lz4_enable\)/\1default: true\2/' "$FILE"
            # lz4kd_enable: default false (已经是false)
            # bbr_enable: default false
            sed -i 's/^\(\s*\)default: '"'"'.*'"'"'\(\s*#.*bbr_enable\)/\1default: '"'false'"'\2/' "$FILE"
            # better_net: default false
            sed -i 's/^\(\s*\)default: true\(\s*#.*better_net\)/\1default: false\2/' "$FILE"
            # adios_enable: default true
            sed -i 's/^\(\s*\)default: false\(\s*#.*adios_enable\)/\1default: true\2/' "$FILE"
            # rekernel_enable: default true
            sed -i 's/^\(\s*\)default: false\(\s*#.*rekernel_enable\)/\1default: true\2/' "$FILE"
            # baseband_guard: default true
            sed -i 's/^\(\s*\)default: false\(\s*#.*baseband_guard\)/\1default: true\2/' "$FILE"
            # ccache_update, ccache_debug, kernel_suffix 保持原默认值即可

            echo "Default values updated."
            # 将修改加入暂存区
            git add "$FILE"
          else
            echo "Warning: $FILE not found, skipping default modification."
          fi

      - name: Commit and push changes
        if: env.has_new_commits == 'true'
        run: |
          # 查看是否有新的修改（包括合并和默认值修改）
          if git diff --cached --quiet; then
            echo "No changes to commit after all."
            echo "has_new_commits=false" >> $GITHUB_ENV
          else
            git commit -m "Auto-merge upstream + set preferred defaults"
            git push origin main
          fi

      - name: Trigger kernel build (now with your defaults)
        if: env.has_new_commits == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 无需传递任何 -f 参数，因为工作流的默认值已经是您的偏好
          gh workflow run fastbuild_6.6.89.yml --ref main
