name: Auto Sync Upstream & Trigger Build

on:
  schedule:
    - cron: '0 0,12 * * *'   # UTC 0:00 & 12:00 → 北京时间 8:00 & 20:00
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/cctv18/oppo_oplus_realme_sm8750.git
          git fetch upstream

      - name: Configure git user
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Merge upstream changes while preserving auto-sync.yml
        id: merge
        run: |
          set +e
          git merge --no-commit --no-ff upstream/main
          MERGE_EXIT_CODE=$?
          set -e

          if [ $MERGE_EXIT_CODE -eq 0 ]; then
            if git diff --cached --quiet; then
              echo "No changes from upstream, skipping commit."
              git merge --abort 2>/dev/null || true
              echo "has_new_commits=false" >> $GITHUB_OUTPUT
            else
              echo "New commits from upstream, preserving auto-sync.yml..."
              git checkout HEAD -- .github/workflows/auto-sync.yml
              git commit -m "Auto-merge upstream changes (preserve auto-sync.yml)"
              echo "has_new_commits=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "Merge failed with exit code $MERGE_EXIT_CODE"
            git merge --abort 2>/dev/null || true
            exit 1
          fi

      - name: Push changes to your fork using PAT
        if: steps.merge.outputs.has_new_commits == 'true'
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git push https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git main

      - name: Trigger kernel build (always, with your preferred inputs)
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh workflow run fastbuild_6.6.89.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f ksu_type="resukisu" \
            -f susfs_enable="false" \
            -f kpm_enable="false" \
            -f lz4_enable="true" \
            -f lz4kd_enable="false" \
            -f bbr_enable="false" \
            -f better_net="false" \
            -f adios_enable="true" \
            -f rekernel_enable="true" \
            -f baseband_guard="true" \
            -f ccache_update="false" \
            -f ccache_debug="false" \
            -f kernel_suffix=""
