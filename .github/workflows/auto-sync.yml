name: Auto Sync Upstream & Trigger Build

on:
  schedule:
    - cron: '0 0,12 * * *'   # 每天 UTC 0:00 和 12:00 → 北京时间 8:00 和 20:00
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/cctv18/oppo_oplus_realme_sm8750.git
          git fetch upstream

      - name: Configure git user (for potential merge commits)
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Merge upstream changes while preserving auto-sync.yml
        run: |
          set +e
          git merge --no-commit --no-ff upstream/main
          MERGE_EXIT_CODE=$?
          set -e

          if [ $MERGE_EXIT_CODE -eq 0 ]; then
            if git diff --cached --quiet; then
              echo "No changes from upstream, skipping commit."
              git merge --abort 2>/dev/null || true
            else
              echo "New commits from upstream, preserving auto-sync.yml..."
              SELF_FILE=".github/workflows/auto-sync.yml"
              if [ -f "$SELF_FILE" ]; then
                git checkout HEAD -- "$SELF_FILE"
              fi
              git commit -m "Auto-merge upstream changes (preserve auto-sync.yml)"
              git push origin main
            fi
          else
            echo "Merge failed with exit code $MERGE_EXIT_CODE"
            git merge --abort 2>/dev/null || true
            exit $MERGE_EXIT_CODE
          fi

      - name: Trigger kernel build (always, with your preferred inputs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run fastbuild_6.6.89.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f ksu_type="resukisu" \
            -f susfs_enable="false" \
            -f kpm_enable="false" \
            -f lz4_enable="true" \
            -f lz4kd_enable="false" \
            -f bbr_enable="false" \
            -f better_net="false" \
            -f adios_enable="true" \
            -f rekernel_enable="true" \
            -f baseband_guard="true" \
            -f ccache_update="false" \
            -f ccache_debug="false" \
            -f kernel_suffix=""
